{% extends "base.html" %}
{% block title %}Redefinir senha{% endblock %}
{% block auth_content %}
<div class="auth-card card shadow">
  <div class="card-body p-4 p-md-5">
    <h1 class="h5 mb-3"><i class="bi bi-shield-lock me-2"></i>Nova senha</h1>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="password">Nova senha</label>
        <input type="password" class="form-control" id="password" name="password" minlength="6" required autofocus>
        <div class="form-text">Mínimo de 6 caracteres.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm">Confirmar senha</label>
        <input type="password" class="form-control" id="confirm" name="confirm" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Redefinir senha</button>
    </form>
  </div>
</div>
{% endblock %}
