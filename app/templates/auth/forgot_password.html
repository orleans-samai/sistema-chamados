{% extends "base.html" %}
{% block title %}Recuperar senha{% endblock %}
{% block auth_content %}
<div class="auth-card card shadow">
  <div class="card-body p-4 p-md-5">
    <h1 class="h5 mb-3"><i class="bi bi-key me-2"></i>Recuperar senha</h1>
    <p class="text-body-secondary">Informe o e-mail cadastrado para receber o link de redefinição.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100">Enviar link</button>
    </form>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login') }}" class="small">Voltar ao login</a>
    </div>
  </div>
</div>
{% endblock %}
