{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block auth_content %}
<div class="auth-card card shadow">
  <div class="card-body p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-headset display-4 text-primary"></i>
      <h1 class="h4 mt-2 mb-0">Service Desk</h1>
      <p class="text-body-secondary">Sistema de Chamados</p>
    </div>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required autofocus
               placeholder="voce@empresa.com" value="{{ request.form.get('email', '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Senha</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember" name="remember">
          <label class="form-check-label" for="remember">Lembrar-me</label>
        </div>
        <a href="{{ url_for('auth.forgot_password') }}" class="small">Esqueci minha senha</a>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
