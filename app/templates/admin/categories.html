{% extends "base.html" %}
{% block title %}Categorias{% endblock %}
{% block content %}
<h1 class="h4 mb-4"><i class="bi bi-tags me-2"></i>Categorias e subcategorias</h1>

<div class="card mb-4">
  <div class="card-header">Nova categoria</div>
  <div class="card-body">
    <form method="post" class="row g-2">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="col-md-4">
        <input type="text" class="form-control form-control-sm" name="name" placeholder="Nome da categoria" required>
      </div>
      <div class="col-md-6">
        <input type="text" class="form-control form-control-sm" name="description" placeholder="Descrição (opcional)">
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-plus-lg me-1"></i>Criar</button>
      </div>
    </form>
  </div>
</div>

{% for c in categories %}
<div class="card mb-3">
  <div class="card-body">
    <form method="post" action="{{ url_for('admin.edit_category', category_id=c.id) }}" class="row g-2 align-items-center">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="col-md-3">
        <input type="text" class="form-control form-control-sm" name="name" value="{{ c.name }}" required>
      </div>
      <div class="col-md-4">
        <input type="text" class="form-control form-control-sm" name="description" value="{{ c.description or '' }}" placeholder="Descrição">
      </div>
      <div class="col-md-2">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="active" id="cat-active-{{ c.id }}" {{ 'checked' if c.active }}>
          <label class="form-check-label small" for="cat-active-{{ c.id }}">Ativa</label>
        </div>
      </div>
      <div class="col-md-3 text-end">
        <button type="submit" class="btn btn-outline-primary btn-sm"><i class="bi bi-check-lg"></i> Salvar</button>
        <button type="submit" class="btn btn-outline-danger btn-sm"
                formaction="{{ url_for('admin.delete_category', category_id=c.id) }}"
                formnovalidate
                onclick="return confirm('Excluir a categoria {{ c.name }}?')">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </form>

    <div class="mt-3 ps-3 border-start">
      <div class="d-flex flex-wrap gap-2 align-items-center">
        {% for s in c.subcategories %}
        <span class="badge text-bg-light border d-inline-flex align-items-center gap-1">
          {{ s.name }}
          <form method="post" action="{{ url_for('admin.delete_subcategory', subcategory_id=s.id) }}" class="d-inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-link btn-sm p-0 text-danger" title="Excluir subcategoria"
                    onclick="return confirm('Excluir a subcategoria {{ s.name }}?')">
              <i class="bi bi-x"></i>
            </button>
          </form>
        </span>
        {% else %}
        <small class="text-body-secondary">Sem subcategorias.</small>
        {% endfor %}
      </div>
      <form method="post" action="{{ url_for('admin.add_subcategory', category_id=c.id) }}" class="d-flex gap-2 mt-2" style="max-width: 360px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" class="form-control form-control-sm" name="name" placeholder="Nova subcategoria" required>
        <button type="submit" class="btn btn-outline-secondary btn-sm text-nowrap"><i class="bi bi-plus-lg"></i></button>
      </form>
    </div>
  </div>
</div>
{% endfor %}
{% endblock %}
