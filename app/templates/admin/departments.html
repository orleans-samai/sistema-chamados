{% extends "base.html" %}
{% block title %}Departamentos{% endblock %}
{% block content %}
<h1 class="h4 mb-4"><i class="bi bi-building me-2"></i>Departamentos</h1>

<div class="card mb-4">
  <div class="card-header">Novo departamento</div>
  <div class="card-body">
    <form method="post" class="row g-2">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="col-md-4">
        <input type="text" class="form-control form-control-sm" name="name" placeholder="Nome" required>
      </div>
      <div class="col-md-6">
        <input type="text" class="form-control form-control-sm" name="description" placeholder="Descrição (opcional)">
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-plus-lg me-1"></i>Criar</button>
      </div>
    </form>
  </div>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>Nome</th><th>Descrição</th><th>Usuários</th><th class="text-end">Ações</th></tr></thead>
      <tbody>
        {% for d in departments %}
        <tr>
          <td colspan="4" class="p-2">
            <form method="post" action="{{ url_for('admin.edit_department', department_id=d.id) }}" class="row g-2 align-items-center">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <div class="col-md-3">
                <input type="text" class="form-control form-control-sm" name="name" value="{{ d.name }}" required>
              </div>
              <div class="col-md-5">
                <input type="text" class="form-control form-control-sm" name="description" value="{{ d.description or '' }}">
              </div>
              <div class="col-md-1 text-center"><span class="badge text-bg-secondary">{{ d.users|length }}</span></div>
              <div class="col-md-3 text-end">
                <button type="submit" class="btn btn-outline-primary btn-sm"><i class="bi bi-check-lg"></i> Salvar</button>
                <button type="submit" class="btn btn-outline-danger btn-sm"
                        formaction="{{ url_for('admin.delete_department', department_id=d.id) }}"
                        formnovalidate
                        onclick="return confirm('Excluir o departamento {{ d.name }}?')">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-body-secondary py-4">Nenhum departamento cadastrado.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
